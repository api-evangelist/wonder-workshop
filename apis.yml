name: Wonder Workshop
description: >-
  Wonder Workshop (GitHub org "playi", originally Play-i) is an educational
  technology company that makes the Dash, Dot, and Cue programmable robots and
  the Make Wonder K-8 coding and robotics learning platform, used by more than
  40,000 schools across 65 countries. Its developer surface is a set of official
  SDKs that give granular realtime control of the physical robots' sensors and
  actuators over Bluetooth Low Energy: WonderPy (Python, on PyPI),
  @wonderworkshop/wwjs (JavaScript, on npm), and an iOS/Android robot framework
  shipped in the playground sample-app repository. There is no HTTP/cloud REST
  API, OAuth, or webhook surface; integration happens locally over BLE. Backed
  by GV.
